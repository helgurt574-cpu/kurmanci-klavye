name: Mac

on:
  push:
    branches: [main]
    paths: ['mac/**', 'app/src/main/assets/tr_ku.tsv', '.github/workflows/mac.yml']
    tags: ['mac-v*']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel, like the user's Mac. The .app from this job is the one published.
          - name: intel
            runner: macos-15-intel
            publish: true
          - name: apple-silicon
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Unit tests
        working-directory: mac
        run: swift test

      - name: Build universal app
        working-directory: mac
        run: bash build.sh

      - name: Check bundle
        working-directory: mac
        run: |
          app=build/KurmanciKlavye.app
          plutil -lint "$app/Contents/Info.plist"
          archs=$(lipo -archs "$app/Contents/MacOS/KurmanciKlavye")
          echo "archs: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          codesign --verify --verbose "$app"
          "$app/Contents/MacOS/KurmanciKlavye" --selftest

      - name: Install into ~/Library/Input Methods and register
        working-directory: mac
        run: |
          bash build.sh install
          ls -la "$HOME/Library/Input Methods"

      - name: Zip
        if: matrix.publish
        working-directory: mac/build
        run: ditto -c -k --keepParent KurmanciKlavye.app KurmanciKlavye-mac.zip

      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: KurmanciKlavye-mac
          path: mac/build/KurmanciKlavye-mac.zip

  # macOS 13 Ventura's Command Line Tools ship Swift 5.9, older than any macOS runner image: check the package
  # manifest and the core logic with that compiler.
  swift59:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (Swift 5.9)
        working-directory: mac
        run: swift --version && swift test

  release:
    if: startsWith(github.ref, 'refs/tags/mac-v')
    needs: [build, swift59]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KurmanciKlavye-mac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" KurmanciKlavye-mac.zip \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Kurmancî Klavye Mac ${GITHUB_REF_NAME#mac-v}" \
            --notes "macOS 13+ (Intel ve Apple Silicon) için Kurmancî Klavye girdi kaynağı. Kurulum: mac/README.md"
